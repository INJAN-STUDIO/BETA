name: Build Android APK

# Builds the B.E.T.A. app for you in GitHub's cloud, so nothing heavy runs on your phone.
# Run it by hand: GitHub -> Actions -> "Build Android APK" -> Run workflow. The APK is in the run's "Artifacts".
# You only need a new APK when capacitor.config.json or the android/ folder changes. Website updates reach the app by themselves.
on:
  workflow_dispatch:
  push:
    paths:
      - capacitor.config.json
      - package.json
      - www/**
      - android/**
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # Capacitor 8 needs Node 22 or newer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21          # Capacitor 8 builds with Java 21

      - name: Install packages
        run: |
          npm install
          # Reply alerts (Firebase) need Capacitor's official push plugin. It is added here when package.json does not list it
          # yet, using the same major version as Capacitor itself (8 -> 8.x).
          if ! node -e "const p=require('./package.json'); process.exit((p.dependencies||{})['@capacitor/push-notifications']?0:1)"; then
            MAJOR=$(node -p "require('@capacitor/core/package.json').version.split('.')[0]")
            echo "Adding @capacitor/push-notifications@^${MAJOR}.0.0"
            npm install "@capacitor/push-notifications@^${MAJOR}.0.0"
          fi

      - name: Create or update the Android project
        run: |
          # An android/ folder without gradlew is incomplete (parts were left out of the repo): start it fresh.
          if [ ! -f android/gradlew ]; then rm -rf android; npx cap add android; fi
          npx cap sync android

      - name: Add the camera and notification permissions
        run: |
          # The android/ folder is made fresh above, so the permissions B.E.T.A. needs are added to the new manifest here
          # (camera + video, microphone, notifications, and the "Replies" alert channel). Safe to run twice.
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p, encoding="utf-8").read()
          add = ""
          for perm in ("CAMERA", "RECORD_AUDIO", "POST_NOTIFICATIONS"):
              if "android.permission.%s" % perm not in m:
                  add += '    <uses-permission android:name="android.permission.%s" />\n' % perm
          if "android.hardware.camera" not in m:
              add += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          if "<queries>" not in m:
              add += ('    <queries>\n'
                      '        <intent><action android:name="android.media.action.IMAGE_CAPTURE" /></intent>\n'
                      '        <intent><action android:name="android.media.action.VIDEO_CAPTURE" /></intent>\n'
                      '        <intent><action android:name="android.intent.action.GET_CONTENT" /><data android:mimeType="*/*" /></intent>\n'
                      '    </queries>\n')
          if add:
              i = m.index("<application")
              m = m[:i] + "<!-- B.E.T.A. permissions (added by the build) -->\n" + add + "\n    " + m[i:]
          if "default_notification_channel_id" not in m:
              m = re.sub(r"(<application\b[^>]*>)", r'\1\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="beta_replies" />', m, count=1)
          open(p, "w", encoding="utf-8").write(m)
          print("Manifest updated.")
          PY
          echo "--- permissions and alert channel in the manifest ---"
          grep -n "permission\|queries\|channel_id\|uses-feature" android/app/src/main/AndroidManifest.xml || true
