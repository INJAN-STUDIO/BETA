<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B.E.T.A. System</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Hamburger Menu -->
        <div id="menu-overlay"></div>
        <nav id="sidebar">
            <button id="close-menu">×</button>
            <div class="sidebar-item">New Chat</div>
            <div class="sidebar-item">History</div>
        </nav>

        <header>
            <button id="menu-btn">☰</button>
            <h1>B.E.T.A.</h1>
            <div class="status">Online</div>
        </header>

        <div id="chat-container">
            <!-- Messages will appear here -->
        </div>

        <div id="thinking-indicator" class="hidden">B.E.T.A. is thinking...</div>

        <div id="input-area">
            <input type="text" id="user-input" placeholder="Type a command or question...">
            <button id="send-btn">➔</button>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
