<!DOCTYPE html>
<html lang="en" data-theme="icon-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#051a22">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>B.E.T.A</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="application-name" content="B.E.T.A">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/style.css?v=__V__">
<link rel="stylesheet" href="/static/themes.css?v=__V__">
<script src="/static/theme-init.js?v=__V__"></script>
</head>
<body>

<!-- Waking the server (Render's free plan sleeps after 15 min idle) -->
<div id="wake" class="screen">
  <div class="screen-card">
    <div class="logo-wrap"><img class="logo-img" src="/static/logo.jpg" alt="B.E.T.A" width="116" height="116"><span class="logo-ring"></span></div>
    <div class="screen-title"><svg class="wordmark wm-big" viewBox="-2 0 112 28" role="img" aria-label="B.E.T.A" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2L2 26"/><path d="M2 2L10 2Q16.5 2 16.5 8Q16.5 14 10 14L2 14"/><path d="M2 14L11 14Q18.5 14 18.5 20Q18.5 26 11 26L2 26"/><path d="M45 2L31 2L31 26L45 26"/><path d="M31 14L42 14"/><path d="M57 2L75 2"/><path d="M66 2L66 26"/><path d="M87 26L97 2L107 26"/><path d="M90.6 18L103.4 18"/><circle cx="24.75" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="51" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="81" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/></svg></div>
    <div id="wake-text" class="screen-sub">Connecting…</div>
    <div class="spinner"></div>
  </div>
</div>

<!-- Login -->
<div id="login" class="screen hidden">
  <div class="screen-card">
    <div class="logo-wrap"><img class="logo-img" src="/static/logo.jpg" alt="B.E.T.A" width="116" height="116"><span class="logo-ring"></span></div>
    <div class="screen-title"><svg class="wordmark wm-big" viewBox="-2 0 112 28" role="img" aria-label="B.E.T.A" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2L2 26"/><path d="M2 2L10 2Q16.5 2 16.5 8Q16.5 14 10 14L2 14"/><path d="M2 14L11 14Q18.5 14 18.5 20Q18.5 26 11 26L2 26"/><path d="M45 2L31 2L31 26L45 26"/><path d="M31 14L42 14"/><path d="M57 2L75 2"/><path d="M66 2L66 26"/><path d="M87 26L97 2L107 26"/><path d="M90.6 18L103.4 18"/><circle cx="24.75" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="51" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="81" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/></svg></div>
    <div class="screen-sub">Best Everyday Technical Assistant</div>
    <input id="password" class="field" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="login-btn" class="btn-primary"><span data-icon="unlock"></span>Unlock</button>
    <div id="login-error" class="error-line"></div>
  </div>
</div>

<!-- The app -->
<div id="app" class="app hidden">
  <header class="header">
    <div class="brand">
      <div class="blob"></div>
      <div>
        <div class="brand-name"><svg class="wordmark wm-small" viewBox="-2 0 112 28" role="img" aria-label="B.E.T.A" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2L2 26"/><path d="M2 2L10 2Q16.5 2 16.5 8Q16.5 14 10 14L2 14"/><path d="M2 14L11 14Q18.5 14 18.5 20Q18.5 26 11 26L2 26"/><path d="M45 2L31 2L31 26L45 26"/><path d="M31 14L42 14"/><path d="M57 2L75 2"/><path d="M66 2L66 26"/><path d="M87 26L97 2L107 26"/><path d="M90.6 18L103.4 18"/><circle cx="24.75" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="51" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/><circle cx="81" cy="25.3" r="1.9" fill="currentColor" stroke="none" opacity=".75"/></svg></div>
        <div class="brand-sub" id="state-label">ready</div>
      </div>
    </div>
    <button id="menu-btn" class="icon-btn" aria-label="Menu" data-icon="menu"></button>
  </header>

  <div class="meter" id="usage-meter">
    <span id="usage-label" class="meter-label">Requests —</span>
    <div class="meter-track"><div id="usage-fill" class="meter-fill"></div></div>
    <span id="usage-reset" class="meter-reset"></span>
  </div>

  <main id="chat" class="chat" tabindex="-1"></main>

  <div id="activity" class="activity hidden"><span class="activity-dot"></span><span id="activity-text"></span></div>
  <button id="jump" class="jump hidden" aria-label="Scroll to the latest message" title="Scroll to the latest message"><span data-icon="arrow-down"></span></button>

  <footer class="composer">
    <div id="attach-row" class="attach-row hidden"></div>
    <div class="composer-pill">
      <textarea id="input" class="input" rows="1" placeholder="Ask B.E.T.A. something…" enterkeyhint="send"></textarea>
      <div class="composer-row">
        <div class="composer-left">
          <button id="attach-btn" class="icon-btn" aria-label="Attach" data-icon="clip"></button>
          <button id="paste-btn" class="icon-btn" aria-label="Paste from clipboard" data-icon="clipboard"></button>
          <button id="mic-btn" class="icon-btn hidden" aria-label="Speak" data-icon="mic"></button>
        </div>
        <button id="send-btn" class="send-btn" aria-label="Send" data-icon="send"></button>
      </div>
    </div>
    <input id="file-input" type="file" accept="image/*,video/*,.mp4,.mov,.webm,.3gp,.mkv,.txt,.md,.py,.js,.json,.csv,.html,.css,.xml,.yaml,.yml,.sh,.log,.docx" multiple hidden>
  </footer>
</div>

<!-- Menu -->
<div id="menu" class="overlay hidden">
  <div class="sheet menu-sheet">
    <div class="sheet-title">Menu</div>
    <div class="menu-scroll">
    <button class="sheet-item" id="m-memory"><span data-icon="bookmark"></span>Long-term memory</button>
    <button class="sheet-item" id="m-help"><span data-icon="help"></span>What can B.E.T.A. do?</button>
    <button class="sheet-item" id="m-voice"><span id="m-voice-icon" data-icon="speaker"></span><span id="m-voice-text">Read replies aloud (Brian): off</span></button>
    <button class="sheet-item" id="m-notify"><span id="m-notify-icon" data-icon="bell-off"></span><span id="m-notify-text">Notify me when a reply is ready: off</span></button>
    <button class="sheet-item hidden" id="m-termux"><span data-icon="terminal"></span><span id="m-termux-text">Termux: checking…</span></button>
    <button class="sheet-item" id="m-model-pick"><span data-icon="cpu"></span><span id="m-model-text">Model: Auto</span></button>
    <button class="sheet-item" id="m-traffic"><span data-icon="activity"></span><span>Gemini traffic (live check)</span></button>
    <button class="sheet-item hidden" id="m-k10"><span data-icon="mail"></span><span id="m-k10-text">K-10 mail</span></button>
    <button class="sheet-item" id="m-theme"><span id="m-theme-icon" data-icon="palette"></span><span id="m-theme-text">Theme: Logo colours · Dark</span></button>
    <button class="sheet-item" id="m-size"><span data-icon="text"></span><span id="m-size-text">Text size: Medium</span></button>
    <button class="sheet-item" id="m-install"><span data-icon="download"></span><span>Install as an app</span></button>
    <button class="sheet-item" id="m-clear"><span data-icon="trash"></span>Clear this conversation</button>
    <button class="sheet-item" id="m-logout"><span data-icon="lock"></span>Lock B.E.T.A.</button>
    <div class="sheet-models" id="m-models"></div>
    <div class="sheet-version" id="m-version"></div>
    </div>
    <button class="sheet-close" id="menu-close">Close</button>
  </div>
</div>

<!-- What can B.E.T.A. do? -->
<div id="help" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">What B.E.T.A. can do</div>
    <div id="help-body" class="sheet-scroll"></div>
    <button class="sheet-close" id="help-close">Close</button>
  </div>
</div>

<!-- Pick a theme -->
<div id="themes" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">Theme</div>
    <div id="themes-body" class="sheet-scroll"></div>
    <button class="sheet-close" id="themes-close">Close</button>
  </div>
</div>

<!-- Pasted text, in full -->
<div id="pasteview" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">Pasted text</div>
    <div id="pasteview-body" class="sheet-scroll k10-text" style="max-height:none"></div>
    <div class="tc-actions" style="margin:10px 0 4px">
      <button class="fc-btn danger" id="pasteview-remove">Remove it</button>
      <button class="fc-btn primary" id="pasteview-close">Close</button>
    </div>
  </div>
</div>

<!-- Are you sure? -->
<div id="confirm" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-title" id="confirm-title">Are you sure?</div>
    <div id="confirm-text" class="sheet-text"></div>
    <div class="tc-actions" style="margin:12px 0 4px">
      <button class="fc-btn danger" id="confirm-yes">Yes</button>
      <button class="fc-btn primary" id="confirm-no">Cancel</button>
    </div>
  </div>
</div>

<!-- Choose the model by hand -->
<div id="models" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">Model</div>
    <div id="models-body" class="sheet-scroll"></div>
    <button class="sheet-close" id="models-close">Close</button>
  </div>
</div>

<!-- Gemini traffic: a live check of how busy Google's servers are -->
<div id="traffic" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">Gemini traffic</div>
    <div id="traffic-body" class="sheet-scroll"></div>
    <div id="traffic-note" class="sheet-text"></div>
    <button class="sheet-close" id="traffic-refresh">Refresh now</button>
    <button class="sheet-close" id="traffic-close">Close</button>
  </div>
</div>

<!-- K-10 mail -->
<div id="k10" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">K-10 mail</div>
    <div class="k10-tabs"><button id="k10-t-inbox" class="fc-btn">Inbox</button><button id="k10-t-sent" class="fc-btn">Sent</button><button id="k10-t-compose" class="fc-btn primary">Write</button></div>
    <div id="k10-body" class="sheet-scroll"></div>
    <button class="sheet-close" id="k10-close">Close</button>
  </div>
</div>

<!-- Install help (Firefox/Fennec have no install pop-up, so this says exactly what to tap) -->
<div id="install" class="overlay hidden">
  <div class="sheet">
    <div class="sheet-title">Install B.E.T.A.</div>
    <div id="install-body" class="sheet-text"></div>
    <button class="sheet-close" id="install-close">Close</button>
  </div>
</div>

<!-- Memory -->
<div id="memory" class="overlay hidden">
  <div class="sheet tall">
    <div class="sheet-title">Long-term memory</div>
    <div id="memory-list" class="sheet-scroll"></div>
    <button class="sheet-close" id="memory-close">Close</button>
  </div>
</div>

<!-- Photo viewer -->
<div id="lightbox" class="lightbox hidden">
  <div class="lightbox-card">
    <div class="lightbox-stage"><img id="lb-img" alt=""><div id="lb-status" class="lb-status"></div></div>
    <div class="lightbox-info">
      <div class="lb-text"><div id="lb-title" class="lb-title"></div><div id="lb-source" class="lb-source"></div></div>
      <div class="lb-actions">
        <button id="lb-save" class="lb-btn" style="display:none"><span data-icon="download"></span>Save</button>
        <button id="lb-open" class="lb-btn"><span data-icon="external"></span>Source</button>
        <button id="lb-close" class="lb-btn"><span data-icon="x"></span>Close</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/static/app.js?v=__V__"></script>
</body>
</html>
